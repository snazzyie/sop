<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SOP Recorder</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>SOP Recorder</h1>
                <p>Record, document, and share your processes automatically</p>
            </div>

            <!-- Login Form -->
            <div id="login-form-container">
                <h2>Login to Your Account</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" class="form-control" required placeholder="your@email.com">
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Login</button>
                </form>

                <p class="auth-switch">
                    Don't have an account?
                    <a href="#" id="show-register">Sign up</a>
                </p>
            </div>

            <!-- Register Form -->
            <div id="register-form-container" style="display: none;">
                <h2>Create Your Account</h2>
                <form id="register-form">
                    <div class="form-group">
                        <label for="register-name">Name (optional)</label>
                        <input type="text" id="register-name" class="form-control" placeholder="John Doe">
                    </div>

                    <div class="form-group">
                        <label for="register-email">Email</label>
                        <input type="email" id="register-email" class="form-control" required placeholder="your@email.com">
                    </div>

                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <input type="password" id="register-password" class="form-control" required placeholder="••••••••" minlength="6">
                        <small>Minimum 6 characters</small>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Create Account</button>
                </form>

                <p class="auth-switch">
                    Already have an account?
                    <a href="#" id="show-login">Login</a>
                </p>
            </div>

            <!-- Error Message -->
            <div id="auth-error" class="error-message" style="display: none;"></div>

            <!-- Success Message -->
            <div id="auth-success" class="success-message" style="display: none;"></div>
        </div>
    </div>

    <script src="../js/auth-page.js"></script>
</body>
</html>
